<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Cadastro</title>
    <link rel="stylesheet" href="css/paginaCadastro.css">
</head>
<body>

<header>
    <div class="logo-placeholder"></div>
</header>

<main class="container">
    <div class="form-container">
        <form action="#" method="post">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <div class="form-group">
                <label for="role">Tipo de Usuário</label>
                <select id="role" name="role" class="form-group input">
                    <option value="ROLE_USER">USER</option>
                    <option value="ROLE_ADMIN">ADMIN</option>
                </select>
            </div>

            <div id="recebeEmailGroup" class="form-group" style="display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="recebeEmail" name="recebeEmail" style="width: auto;">
                <label for="recebeEmail" style="margin-bottom: 0;">Desejo receber e-mails e novidades.</label>
            </div>

            <button type="submit">Cadastre-se</button>
        </form>
    </div>

    <div class="image-panel">
    </div>
</main>

<script src="js/paginaCadastro.js"></script>

</body>
</html>
