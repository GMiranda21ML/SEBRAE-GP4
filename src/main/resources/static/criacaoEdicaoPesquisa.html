<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criação de Pesquisa</title>
    <link rel="stylesheet" href="css/criacaoEdicaoPesquisa.css">
</head>
<body>

<header class="header">
    <div class="logo-placeholder"></div>
    <button class="logout-btn">Log out</button>
</header>

<main class="main-content">

    <div class="form-container">
        <input type="text" class="title-input" placeholder="Título da pesquisa">

        <textarea class="summary-textarea" placeholder="Resumo sobre cliente e intuito da pesquisa"></textarea>

        <div class="form-body">
        </div>
        <input type="text" class="footer-input" placeholder="Escreva aqui...">
    </div>

    <aside class="sidebar">
        <label class="sidebar-label">Adicionar:</label>
        <div class="add-buttons">
            <button class="sidebar-btn">Questionario</button>
            <button class="sidebar-btn">Escala</button>
            <button class="sidebar-btn">Texto</button>
            <button class="sidebar-btn">Caixa de resposta</button>
        </div>

        <label class="sidebar-label">Meios de envio:</label>
        <div class="toggle-group">
            <div class="toggle-item">
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
                <span class="toggle-label">E-mail</span>
            </div>
            <div class="toggle-item">
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
                <span class="toggle-label">SMS</span>
            </div>
            <div class="toggle-item">
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
                <span class="toggle-label">WhatsApp</span>
            </div>
        </div>

        <button class="save-btn">Salvar rascunho</button>
    </aside>

</main>

<script src="js/criacaoEdicaoPesquisa.js"></script>
</body>
</html>
