<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/paginaLogin.css">
</head>
<body>
<div class="login-container">
    <form class="login-form">
        <a href="index.html" title="Voltar para a Home">
            <img src="img/simbolo_azulclaro.png" alt="Logo do Sistema" class="form-logo">
        </a>

        <h2></h2>

        <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="input-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <button type="submit" class="btn-login">ENTRAR</button>

        <div class="account-help">
            <p>Não tem uma conta?</p>
            <a href="paginaCadastro.html" class="btn-cadastro">CADASTRAR-SE</a>
        </div>
    </form>
</div>

<script src="js/paginaLogin.js"></script>
</body>
</html>
