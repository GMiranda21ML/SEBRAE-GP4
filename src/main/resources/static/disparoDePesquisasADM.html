<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disparo de Pesquisas</title>

    <link rel="stylesheet" href="css/disparoDePesquisasADM.css">
    <link rel="stylesheet" href="css/header.css"> </head>
<body>

<div id="header-placeholder"></div>
<main class="main-content">
    <div class="page-content">

        <div class="search-bar">
            <span class="search-placeholder">Pesquisar</span>
            <button class="filter-btn">Filtrar</button>
        </div>

        <div class="list-container">
        </div>

    </div>
</main>

<div id="confirmation-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 class="modal-title">Disparo de pesquisa realizado com sucesso!</h3>
        <p class="modal-message">
            Você pode acompanhar os resultados da pesquisa na aba 'Análise de dados'
        </p>
        <button id="modal-return-btn" class="modal-btn">Retornar</button>
    </div>
</div>

<script src="js/apiService.js"></script>
<script src="js/disparoDePesquisasADM.js"></script>
<script src="js/headerLoader.js"></script>
</body>
</html>
