<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disparo de Pesquisas</title>

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/disparoDePesquisasADM.css">
</head>
<body>

<div id="header-placeholder"></div>

<main class="main-content">

    <div class="page-content">

        <div class="search-bar">
            <span class="search-placeholder">Pesquisar</span>
            <button class="filter-btn">Filtrar</button>
        </div>

        <div class="list-container">

            <div class="list-item">
                <div class="item-actions">
                    <div class="action-icon green"></div>
                    <div class="action-icon red"></div>
                </div>
            </div>

            <div class="list-item">
                <div class="item-actions">
                    <div class="action-icon green"></div>
                    <div class="action-icon red"></div>
                </div>
            </div>

        </div>

    </div>

</main>

<div id="confirmation-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 class="modal-title">Disparo de pesquisa realizado com sucesso!</h3>
        <p class="modal-message">
            Você pode acompanhar os resultados da pesquisa na aba 'Análise de dados'
        </p>
        <button id="modal-return-btn" class="modal-btn">Retornar</button>
    </div>
</div>

<script>
    fetch("header.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("header-placeholder").innerHTML = data;
        });
</script>

<script src="js/apiService.js"></script>
<script src="js/disparoDePesquisasADM.js"></script>

</body>
</html>
