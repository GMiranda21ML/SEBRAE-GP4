<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disparo de Pesquisas</title>

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/disparoDePesquisasADM.css">
</head>
<body>

<div id="header-placeholder"></div>

<main class="main-content">
    <div class="page-content">

        <div class="controls-bar">
            <input type="text" class="search-bar" placeholder="Pesquisar...">

            <div class="controls-buttons">
                <button class="filter-btn">Filtrar</button>
            </div>
        </div>

        <div class="list-container">
        </div>

    </div>
</main>

<div id="confirmation-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 class="modal-title">Sucesso!</h3>
        <p class="modal-message">
            Disparo de pesquisa realizado com sucesso!<br>
            Acompanhe os resultados na aba 'Análise de dados'.
        </p>
        <button id="modal-return-btn" class="modal-btn">Continuar</button>
    </div>
</div>

<script src="js/apiService.js"></script>
<script src="js/disparoDePesquisasADM.js"></script>
<script src="js/headerLoader.js"></script>
</body>
</html>
