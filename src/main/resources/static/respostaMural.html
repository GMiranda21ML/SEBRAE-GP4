<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comentários</title>
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/respostaMural.css">
</head>
<body>

<div id="header-placeholder"></div>

<div class="page-wrapper">
    <button class="back-btn" onclick="window.history.back()">← Voltar para o Mural</button>

    <div class="suggestion-box">
        <h2 id="sugestao-texto" style="margin-top: 0; color: #333;">Carregando sugestão...</h2>
        <div style="color: #666; font-size: 0.9em; margin-top: 10px;">
            Postado por <strong id="sugestao-autor">...</strong> • <span id="sugestao-data">...</span>
        </div>
    </div>

    <h3 style="color: #444; margin-bottom: 15px;">Comentários</h3>

    <div id="lista-comentarios" class="comments-list">
    </div>

    <div class="input-area">
        <input type="text" id="comentario-input" class="comment-input" placeholder="Escreva um comentário...">
        <button id="btn-enviar" class="send-btn">Enviar</button>
    </div>
</div>

<script src="js/apiService.js"></script>
<script src="js/respostaMural.js"></script>
<script src="js/headerLoader.js"></script>

</body>
</html>
