<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resposta Mural</title>
    <link rel="stylesheet" href="/css/respostaMural.css">
</head>
<body>

<header class="header">
    <div class="logo-placeholder"></div>
    <a href="homepage.html" class="logout-btn">Log out</a>
</header>

<main class="main-content">

    <div class="response-container">

        <div class="comment-display-box">
            <h3 class="comment-title">Título de comentário feito por um usuário</h3>
            <p class="comment-body">Comentário feito no mural por um usuário</p>
        </div>

        <div class="attachments-display-box">
            <h4 class="attachments-title">Anexos do comentário</h4>
            <div class="attachments-grid">
                <div class="attachment-placeholder"></div>
                <div class="attachment-placeholder"></div>
                <div class="attachment-placeholder"></div>
                <div class="attachment-placeholder"></div>
            </div>
        </div>

        <textarea class="response-textarea" placeholder="Escreva aqui..."></textarea>

    </div>

    <aside class="sidebar">

        <label class="sidebar-label">Adicionar:</label>
        <div class="add-buttons">
            <button class="sidebar-btn">Anexo</button>
        </div>

        <div class="action-buttons">
            <button class="save-btn">Salvar rascunho</button>
            <button class="submit-btn">Enviar resposta</button>
        </div>
    </aside>

</main>

</body>
</html>
